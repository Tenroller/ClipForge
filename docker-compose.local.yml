# Docker Compose for Local Development/Testing
# 1 Frontend, 1 Backend, 2 Video Processors
#
# Usage:
#   docker-compose -f docker-compose.local.yml up --build
#
# To start in detached mode:
#   docker-compose -f docker-compose.local.yml up --build -d
#
# To stop:
#   docker-compose -f docker-compose.local.yml down
#
# To view logs:
#   docker-compose -f docker-compose.local.yml logs -f

services:
  # ==========================================================================
  # DATABASE SERVICES
  # ==========================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: videohelper_postgres
    environment:
      POSTGRES_DB: videohelper
      POSTGRES_USER: videohelper_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videohelper_password}
    ports:
      - "5432:5432" # Expose for local debugging
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - videohelper_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U videohelper_user -d videohelper" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (for caching)
  redis:
    image: redis:7-alpine
    container_name: videohelper_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379" # Expose for local debugging
    volumes:
      - redis_data:/data
    networks:
      - videohelper_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # BACKEND SERVICE
  # ==========================================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: videohelper_backend
    ports:
      - "9000:9000" # Expose API for local testing
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://videohelper_user:${POSTGRES_PASSWORD:-videohelper_password}@postgres:5432/videohelper

      # Redis Configuration
      REDIS_URL: redis://redis:6379/0

      # API Keys (REQUIRED - set in .env file)
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Authentication
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-tenroller}

      # CORS Configuration - allow frontend
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

      # Video Processing Configuration
      VIDEOHELPER_MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      VIDEOHELPER_OUTPUT_DIR: /app/output

      # Video Processor URLs (comma-separated for load balancing between 2 processors)
      VIDEO_PROCESSOR_URLS: http://video-processor-1:8090,http://video-processor-2:8090
      BACKEND_CALLBACK_URL: http://backend:9000

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG_MODE: ${DEBUG_MODE:-false}

      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}

    volumes:
      - video_output:/app/output
      - video_temp:/app/temp
      - video_cache:/app/cache
      - video_logs:/app/logs

    networks:
      - videohelper_network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  # ==========================================================================
  # VIDEO PROCESSOR SERVICES (2 instances for parallel processing)
  # ==========================================================================

  video-processor-1:
    build:
      context: ./video-processor
      dockerfile: Dockerfile
    container_name: videohelper_video_processor_1
    environment:
      # Backend callback URL
      BACKEND_URL: http://backend:9000

      # Shared configuration
      OUTPUT_DIR: /app/output
      TEMP_DIR: /app/temp

      # API Keys (some processors might need these)
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Instance identifier
      PROCESSOR_INSTANCE_ID: processor-1

    volumes:
      - video_output:/app/output
      - video_temp:/app/temp
      - video_logs:/app/logs

    networks:
      - videohelper_network

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  video-processor-2:
    build:
      context: ./video-processor
      dockerfile: Dockerfile
    container_name: videohelper_video_processor_2
    environment:
      # Backend callback URL
      BACKEND_URL: http://backend:9000

      # Shared configuration
      OUTPUT_DIR: /app/output
      TEMP_DIR: /app/temp

      # API Keys (some processors might need these)
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Instance identifier
      PROCESSOR_INSTANCE_ID: processor-2

    volumes:
      - video_output:/app/output
      - video_temp:/app/temp
      - video_logs:/app/logs

    networks:
      - videohelper_network

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  # ==========================================================================
  # FRONTEND SERVICE
  # ==========================================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Backend API URL - for client-side requests from browser
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:9000}
    container_name: videohelper_frontend
    ports:
      - "3000:3000" # Expose frontend for local testing
    environment:
      # Runtime environment variables
      NODE_ENV: production
      # API URL for server-side requests (internal Docker network)
      API_URL: http://backend:9000
    networks:
      - videohelper_network

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

# ==========================================================================
# NETWORKS
# ==========================================================================

networks:
  videohelper_network:
    driver: bridge

# ==========================================================================
# VOLUMES
# ==========================================================================

volumes:
  # PostgreSQL persistent data
  postgres_data:
    driver: local

  # Redis persistent data
  redis_data:
    driver: local

  # Shared video output directory (accessible by backend and processors)
  video_output:
    driver: local

  # Temporary processing files
  video_temp:
    driver: local

  # Application cache
  video_cache:
    driver: local

  # Application logs
  video_logs:
    driver: local
