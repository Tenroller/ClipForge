name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg espeak-ng
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements-dev.txt
        
    - name: Run backend tests
      run: |
        cd backend
        pytest -v
        
    - name: Run backend linting
      run: |
        cd backend
        pip install ruff
        ruff check . || true  # Don't fail on linting issues for now

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --run 2>/dev/null || echo "No frontend tests configured yet"
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint 2>/dev/null || echo "No linting configured yet"

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build backend Docker image
      run: |
        docker build -f Dockerfile.backend -t ai-video-generator-backend .
        
    - name: Build frontend Docker image
      run: |
        docker build -f Dockerfile.frontend -t ai-video-generator-frontend .
        
    - name: Test docker-compose
      run: |
        # Quick smoke test - check if containers start
        timeout 60s docker compose up --build -d || true
        docker compose ps
        docker compose down
