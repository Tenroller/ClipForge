name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Frontend lint ──────────────────────────────────────────────────
  lint-frontend:
    name: Lint frontend (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Backend lint ───────────────────────────────────────────────────
  lint-backend:
    name: Lint backend (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check on backend
        run: ruff check backend/

      - name: Run ruff check on video-processor
        run: ruff check video-processor/

  # ── Backend tests ──────────────────────────────────────────────────
  test-backend:
    name: Test backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
        env:
          PYTHONDONTWRITEBYTECODE: 1

  # ── Docker build verification ──────────────────────────────────────
  docker-build:
    name: Verify Docker builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t clipforge-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t clipforge-frontend:ci ./frontend

      - name: Build video-processor image
        run: docker build -t clipforge-video-processor:ci ./video-processor

  # ── SonarQube ──────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, test-backend]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
