version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: videohelper_postgres
    environment:
      POSTGRES_DB: videohelper
      POSTGRES_USER: videohelper_user
      POSTGRES_PASSWORD: videohelper_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - videohelper_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videohelper_user -d videohelper"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:

networks:
  videohelper_network:
    driver: bridge
