services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai-video-postgres
    env_file:
      - .env
    ports:
      - "5433:5432"  # Using custom port 5433 to avoid conflicts
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-videohelper}
      - POSTGRES_USER=${POSTGRES_USER:-videohelper_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-videohelper_secure_pass_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - ai-video-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videohelper_user} -d ${POSTGRES_DB:-videohelper}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-video-redis
    env_file:
      - .env
    ports:
      - "6380:6379"  # Using custom port 6380 to avoid conflicts
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ai-video-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-video-frontend
    env_file:
      - .env
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    networks:
      - ai-video-network
    restart: unless-stopped

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-video-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      video-processor:
        condition: service_started
    environment:
      # Service-specific overrides (these take precedence over .env file)
      - HOST=0.0.0.0
      - PORT=8080
      - PYTHONPATH=/app
      - VIDEOHELPER_OUTPUT_DIR=/app/output
      - VIDEOHELPER_TEMP_DIR=/app/temp
      - VIDEOHELPER_LOGS_DIR=/app/logs
      # CORS configuration
      - CORS_ALLOW_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      # Video processor configuration
      - VIDEO_PROCESSOR_URLS=http://video-processor:8090
      # Database connection using the container service name
      - DATABASE_URL=postgresql://${POSTGRES_USER:-videohelper_user}:${POSTGRES_PASSWORD:-videohelper_secure_pass_2024}@postgres:5432/${POSTGRES_DB:-videohelper}
      - REDIS_URL=redis://redis:6379
    volumes:
      - shared_output:/app/output
      - shared_temp:/app/temp
      - backend_logs:/app/logs
      - backend_cache:/app/cache
    networks:
      - ai-video-network
    restart: unless-stopped

  # Video Processor Service
  video-processor:
    build:
      context: ./video-processor
      dockerfile: Dockerfile
    container_name: ai-video-processor
    env_file:
      - .env
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          cpus: '5'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Service-specific overrides (these take precedence over .env file)
      - PROCESSOR_HOST=0.0.0.0
      - PROCESSOR_PORT=8090
      - BACKEND_API_URL=http://backend:8080
      - OUTPUT_DIR=/app/output
      - TEMP_DIR=/app/temp
      - PYTHONPATH=/app
      - ESPEAK_PATH=/usr/bin/espeak-ng
      - DATA_PATH=/usr/share/espeak-ng-data
      - REDIS_URL=redis://redis:6379
      - REDIS_DB=1
      # Map GOOGLE_API_KEY from .env to GEMINI_API_KEY for the processor
      - GEMINI_API_KEY=${GOOGLE_API_KEY}
      # Add BACKEND_API_KEY (use the API_KEY from .env)
      - BACKEND_API_KEY=your_secret_api_key
      # FFmpeg configuration to suppress H.264 decoder warnings
      - FFMPEG_LOGLEVEL=error
      - AV_LOG_FORCE_NOCOLOR=1
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=loglevel;error
      - FFREPORT=level=error
    volumes:
      - shared_output:/app/output
      - shared_temp:/app/temp
      - processor_logs:/app/logs
    networks:
      - ai-video-network
    restart: unless-stopped

# Shared volumes for data persistence and sharing
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  shared_output:
    driver: local
  shared_temp:
    driver: local
  backend_logs:
    driver: local
  processor_logs:
    driver: local
  backend_cache:
    driver: local

# Network for service communication
networks:
  ai-video-network:
    driver: bridge