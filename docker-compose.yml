version: '3.8'

services:
  # PostgreSQL Database (Mandatory)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: videohelper
      POSTGRES_USER: videohelper_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - videohelper_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U videohelper_user -d videohelper" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - videohelper_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend - FastAPI Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://videohelper_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}@postgres:5432/videohelper

      # Redis Configuration (optional)
      REDIS_URL: redis://redis:6379/0

      # API Keys (REQUIRED - set in Coolify environment)
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      # Authentication (REQUIRED - set in Coolify environment)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD env var is required}

      # CORS Configuration (Set this to your frontend domain in Coolify)
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}

      # Video Processing Configuration
      VIDEOHELPER_MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      VIDEOHELPER_OUTPUT_DIR: /app/output

      # Video Processor URLs
      VIDEO_PROCESSOR_URLS: http://video-processor:8090
      BACKEND_CALLBACK_URL: http://backend:9000

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG_MODE: ${DEBUG_MODE:-false}

      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}

    volumes:
      # Shared output directory for generated videos
      - video_output:/app/output
      - video_temp:/app/temp
      - video_cache:/app/cache
      - video_logs:/app/logs

    # Expose port 9000 for Coolify/Traefik to route traffic
    expose:
      - "9000"

    networks:
      - videohelper_network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  # Video Processor - Async Processing Service
  video-processor:
    build:
      context: ./video-processor
      dockerfile: Dockerfile
    environment:
      # Backend callback URL
      BACKEND_URL: http://backend:9000

      # Database & Redis for job persistence
      DATABASE_URL: postgresql://videohelper_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}@postgres:5432/videohelper
      REDIS_URL: redis://redis:6379

      # Shared configuration
      OUTPUT_DIR: /app/output
      TEMP_DIR: /app/temp

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # AI API Keys
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

    volumes:
      # Shared volumes with backend
      - video_output:/app/output
      - video_temp:/app/temp
      - video_logs:/app/logs

    networks:
      - videohelper_network

    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  # Frontend - Next.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Backend API URL - This must be the PUBLIC URL if accessed from client-side
        # In Coolify, set NEXT_PUBLIC_API_BASE to your backend's public URL
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:9000}

    # Expose port 3000 (Next.js default) for Coolify/Traefik
    expose:
      - "3000"

    networks:
      - videohelper_network

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "--timeout=5", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped

networks:
  videohelper_network:
    driver: bridge

volumes:
  # PostgreSQL persistent data
  postgres_data:
    driver: local

  # Redis persistent data
  redis_data:
    driver: local

  # Shared video output directory
  video_output:
    driver: local

  # Temporary processing files
  video_temp:
    driver: local

  # Application cache
  video_cache:
    driver: local

  # Application logs
  video_logs:
    driver: local
