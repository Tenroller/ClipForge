version: '3.8'

services:
  # PostgreSQL Database (Mandatory)
  postgres:
    image: postgres:15-alpine
    container_name: videohelper_postgres
    environment:
      POSTGRES_DB: videohelper
      POSTGRES_USER: videohelper_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videohelper_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - videohelper_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videohelper_user -d videohelper"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: videohelper_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - videohelper_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend - FastAPI Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: videohelper_backend
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://videohelper_user:${POSTGRES_PASSWORD:-videohelper_password}@postgres:5432/videohelper

      # Redis Configuration (optional)
      REDIS_URL: redis://redis:6379/0

      # API Keys (REQUIRED - set in Coolify environment)
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Authentication (REQUIRED - set in Coolify environment)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin123}

      # CORS Configuration (Cloudflare Tunnel)
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}

      # Video Processing Configuration
      VIDEOHELPER_MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      VIDEOHELPER_OUTPUT_DIR: /app/output

      # Video Processor URLs
      VIDEO_PROCESSOR_URLS: http://video-processor:8090
      BACKEND_CALLBACK_URL: http://backend:9000

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG_MODE: ${DEBUG_MODE:-false}

      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}

    volumes:
      # Shared output directory for generated videos
      - video_output:/app/output
      - video_temp:/app/temp
      - video_cache:/app/cache
      - video_logs:/app/logs

    networks:
      - videohelper_network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  # Video Processor - Async Processing Service
  video-processor:
    build:
      context: ./video-processor
      dockerfile: Dockerfile
    container_name: videohelper_video_processor
    environment:
      # Backend callback URL
      BACKEND_URL: http://backend:9000

      # Shared configuration
      OUTPUT_DIR: /app/output
      TEMP_DIR: /app/temp

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      # Shared volumes with backend
      - video_output:/app/output
      - video_temp:/app/temp
      - video_logs:/app/logs

    networks:
      - videohelper_network

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  # Frontend - React Application with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Backend API URL - internal Docker network
        VITE_API_URL: ${VITE_API_URL:-http://backend:9000}
    container_name: videohelper_frontend

    # Note: No ports exposed - Coolify's proxy (Traefik/Caddy) handles routing
    # The container internally listens on port 80, Coolify will proxy to it
    expose:
      - "80"

    networks:
      - videohelper_network

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

networks:
  videohelper_network:
    driver: bridge

volumes:
  # PostgreSQL persistent data
  postgres_data:
    driver: local

  # Redis persistent data
  redis_data:
    driver: local

  # Shared video output directory
  video_output:
    driver: local

  # Temporary processing files
  video_temp:
    driver: local

  # Application cache
  video_cache:
    driver: local

  # Application logs
  video_logs:
    driver: local
